# ARCHRUUD Screen Recorder v1.1 for traditional (non-Lua) Hyprland configs.
# Replace old R binding with this one:
bind = SUPER SHIFT, R, exec, bash ~/.config/Quickshell/ScreenRecorder/toggle.sh
# Optional backup STOP key:
bind = SUPER SHIFT, X, exec, bash ~/.config/Quickshell/ScreenRecorder/recorder.sh stop
